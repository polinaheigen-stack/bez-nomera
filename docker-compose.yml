name: bez-nomera-e27
x-runtime: &runtime
  image: bez-nomera:e27
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
    args:
      SOURCE_MANIFEST_SHA256: computed-in-image
  environment: &environment
    VEHICLE_MODEL_BUNDLE: /app/models/e27
    VEHICLE_DEVICE: cuda
    VEHICLE_CPU_THREADS: "2"
  read_only: true
  tmpfs: ["/tmp:rw,size=3g,mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true
  shm_size: 1gb
x-web: &web
  <<: *runtime
  environment:
    <<: *environment
    VEHICLE_RESET_ON_START: "1"
  ports: ["127.0.0.1:${WEB_PORT:-8027}:8017"]
  volumes: [state:/app/var]
  restart: "no"
x-export: &export
  <<: *runtime
  profiles: [tools]
  network_mode: none
  healthcheck: {disable: true}
  entrypoint: [python, /app/scripts/export_results.py]
  volumes:
    - type: bind
      source: ${VEHICLE_DATASET_DIR:-./input}
      target: /data
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${VEHICLE_RESULTS_DIR:-./results}
      target: /results
      bind: {create_host_path: false}
services:
  web:
    <<: *web
    gpus: all
  web-cpu:
    <<: *web
    profiles: [cpu]
    environment:
      <<: *environment
      VEHICLE_DEVICE: cpu
      VEHICLE_RESET_ON_START: "1"
  export:
    <<: *export
    gpus: all
  export-cpu:
    <<: *export
    profiles: [cpu]
    environment:
      <<: *environment
      VEHICLE_DEVICE: cpu
volumes:
  state:
networks:
  default:
    internal: false
